<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot Chat</title>
    <link rel="stylesheet" href="/style.css">
    <!-- highlight.js github-dark theme (UI-SPEC: Markdown Rendering Contract) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
</head>
<body>
    <!-- HEADER: 48px fixed, app name + auth status (D-07) -->
    <header id="header">
        <span class="app-name">Copilot Chat</span>
        <span id="auth-status" class="auth-status"></span>
    </header>

    <div class="main-layout">
        <!-- SIDEBAR: 240px fixed (D-05) -->
        <aside id="sidebar">
            <!-- New Chat button at top (D-06) -->
            <button id="new-chat-btn" class="new-chat-btn">New Chat</button>

            <!-- Thread list (SESS-02) -->
            <div id="thread-list" class="thread-list"></div>

            <!-- Model selector at bottom (D-09, D-10) -->
            <div class="model-selector">
                <label class="model-label" for="model-select">Model:</label>
                <select id="model-select">
                    <optgroup label="Claude">
                        <option value="claude-sonnet-4.5" selected>Claude Sonnet 4.5 (1x)</option>
                        <option value="claude-sonnet-4.6">Claude Sonnet 4.6 (1x)</option>
                        <option value="claude-haiku-4.5">Claude Haiku 4.5 (0.33x)</option>
                        <option value="claude-opus-4.5">Claude Opus 4.5 (3x)</option>
                        <option value="claude-opus-4.6">Claude Opus 4.6 (3x)</option>
                        <option value="claude-opus-4.6-fast">Claude Opus 4.6 fast (30x)</option>
                        <option value="claude-sonnet-4">Claude Sonnet 4 (1x)</option>
                    </optgroup>
                    <optgroup label="GPT">
                        <option value="gpt-5.4">GPT-5.4 (1x)</option>
                        <option value="gpt-5.3-codex">GPT-5.3-Codex (1x)</option>
                        <option value="gpt-5.2-codex">GPT-5.2-Codex (1x)</option>
                        <option value="gpt-5.2">GPT-5.2 (1x)</option>
                        <option value="gpt-5.1-codex-max">GPT-5.1-Codex-Max (1x)</option>
                        <option value="gpt-5.1-codex">GPT-5.1-Codex (1x)</option>
                        <option value="gpt-5.1">GPT-5.1 (1x)</option>
                        <option value="gpt-5.4-mini">GPT-5.4 mini (0.33x)</option>
                        <option value="gpt-5.1-codex-mini">GPT-5.1-Codex-Mini (0.33x)</option>
                        <option value="gpt-5-mini">GPT-5 mini (free)</option>
                        <option value="gpt-4.1">GPT-4.1 (free)</option>
                    </optgroup>
                </select>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main id="chat-area">
            <!-- Message list (scrollable) (CHAT-01) -->
            <div id="message-list" class="message-list">
                <!-- Empty state -->
                <div id="empty-state" class="empty-state">
                    <h2>New conversation</h2>
                    <p>Ask Copilot anything to get started.</p>
                </div>
            </div>

            <!-- Input bar anchored to bottom (CHAT-02, D-13) -->
            <div class="input-bar">
                <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-btn" class="send-btn" aria-label="Send message">&rarr;</button>
            </div>
        </main>
    </div>

    <!-- Device Flow Auth Panel (overlay) (D-01, D-02, D-03) -->
    <div id="auth-panel" class="auth-panel" style="display:none;">
        <div class="auth-panel-content">
            <h2>Connect to GitHub Copilot</h2>
            <p>Open the URL below and enter the code to authenticate.</p>
            <a id="auth-url" class="auth-url" href="#" target="_blank"></a>
            <div class="device-code-section">
                <span id="device-code" class="device-code"></span>
                <button id="copy-code-btn" class="copy-btn">Copy</button>
            </div>
            <div id="auth-polling-status" class="auth-polling-status">
                <span class="spinner"></span>
                <span>Waiting for authentication...</span>
            </div>
        </div>
    </div>

    <!-- CDN scripts: marked.js + marked-highlight + highlight.js (UI-SPEC: Markdown Rendering Contract) -->
    <!-- marked v9: last major version with UMD browser bundle at marked.min.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.3/lib/index.umd.js"></script>
    <!-- highlight.js full browser bundle from cdnjs (includes common languages) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
