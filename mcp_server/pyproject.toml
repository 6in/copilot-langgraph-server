[project]
name = "copilot-mcp-server"
version = "0.1.0"
description = "FastMCP server for Copilot LangGraph agent tools (Phase 20 stubs)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.0,<4.0",
    "langchain-community>=0.4.1",
    "psycopg[pool,binary]>=3.3.0",
    "pyyaml>=6.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.5,<0.2.0",   # Phase 37 D-06
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
