[project]
name = "copilot-mcp-server"
version = "0.1.0"
description = "FastMCP server for Copilot LangGraph agent tools (Phase 20 stubs)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.0,<4.0",
    "langchain-community>=0.4.1",
    "psycopg[pool,binary]>=3.3.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
