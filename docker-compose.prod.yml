# 本番モード compose — nginx + ビルド済みフロント + API + worker + MCP
# 起動: docker compose -f docker-compose.prod.yml up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data-prod:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    working_dir: /mcp_server
    volumes:
      - ./mcp_server:/mcp_server
      - ./config:/mcp_server/config:ro
      - claude-code-outputs-prod:/shared/claude-code-outputs
      - thread-files-prod:/shared/thread-files   # Phase 37 D-04 / Phase 38 ADR-0052 D-04: RW
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DB_POOLS_CONFIG=/mcp_server/config/db_pools.yaml
      - CLAUDE_CODE_OUTPUT_DIR=/shared/claude-code-outputs
      - THREAD_FILES_DIR=/shared/thread-files   # Phase 37 D-04
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s   # Phase 37: MarkItDown + magika/onnxruntime init 吸収 (30s → 60s)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - AGENT_DIR=/app/agents
      - MENU_DIR=/app/menus
      - APP_DIR=/app/apps
      - APP_PREFIX=/orochi
      - THREAD_FILES_DIR=/shared/thread-files   # Phase 37 D-04
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
      - ./config:/app/config:ro
      - thread-files-prod:/shared/thread-files   # Phase 37 D-04: RW (削除 + 将来のアップロード)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run arq app.jobs.worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - AGENT_DIR=/app/agents
      - MENU_DIR=/app/menus
      - APP_DIR=/app/apps
      - MCP_SERVER_URL=http://mcp-server:8001
      - THREAD_FILES_DIR=/shared/thread-files   # Phase 37 D-04
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
      - ./config:/app/config:ro
      - claude-code-outputs-prod:/shared/claude-code-outputs:ro
      - thread-files-prod:/shared/thread-files:ro   # Phase 37 D-04 / Phase 38 ADR-0052 D-04: RO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mcp-server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_APP_BASE: /orochi
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  redis-data-prod:
  postgres-data-prod:
  claude-code-outputs-prod:
  thread-files-prod:        # Phase 37 D-04 / Phase 38 ADR-0052 D-04: api (RW) / mcp-server (RW) / worker (RO)
