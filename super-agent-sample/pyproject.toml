[project]
name = "super-agent-sample"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "github-copilot-sdk==0.2.0",
    "langgraph>=1.1.4",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "cryptography>=41.0",
    "httpx>=0.27",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
