[project]
name = "copilot-langgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.0",
    "github-copilot-sdk==0.2.0",
    "cryptography>=46.0.0",
    "httpx>=0.28.0",
    "langgraph>=1.1.4",
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "python-multipart>=0.0.22",
    "PyJWT>=2.9.0",
    "redis[asyncio]>=4.2.0",
    "arq>=0.26",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "jsonschema>=4.0.0",
]

[dependency-groups]
dev = [
    "fastmcp>=2.14.0,<4.0",
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
