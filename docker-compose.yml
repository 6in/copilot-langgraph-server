services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # ホストポートは公開しない（別Redisとの競合回避）
    # api/worker コンテナからは redis:6379 でアクセス可能
    volumes:
      - redis-data:/data

  mcp-server:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /mcp_server
    command: sh -c "uv sync && uv run python server.py"
    volumes:
      - ./mcp_server:/mcp_server
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    # D-06: ホストポートは公開しない（内部ネットワーク専用）
    # worker からは mcp-server:8001 でアクセス
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - AGENT_DIR=/app/agents
      - MENU_DIR=/app/menus
      - APP_DIR=/app/apps
      - VITE_APP_BASE=${VITE_APP_BASE:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
      - ./config:/app/config:ro  # iframe-rpc DB pool config (Phase 18)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run arq app.jobs.worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - AGENT_DIR=/app/agents
      - MENU_DIR=/app/menus
      - APP_DIR=/app/apps
      - MCP_SERVER_URL=http://mcp-server:8001
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
      - ./config:/app/config:ro  # iframe-rpc DB pool config (Phase 18)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mcp-server:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # anonymous volume preserves container's node_modules
    environment:
      - API_TARGET=http://api:8000
      - VITE_APP_BASE=${VITE_APP_BASE:-}
    depends_on:
      - api

volumes:
  redis-data:
  postgres-data:
