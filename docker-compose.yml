services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # ホストポートは公開しない（別Redisとの競合回避）
    # api/worker コンテナからは redis:6379 でアクセス可能
    volumes:
      - redis-data:/data

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run arq app.jobs.worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  redis-data:
  postgres-data:
