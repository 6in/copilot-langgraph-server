services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  redis:
    image: redis:7-alpine
    # ホストポートは公開しない（別Redisとの競合回避）
    # api/worker コンテナからは redis:6379 でアクセス可能
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
      args:
        # HTTP プロキシ build args — ホスト側で未設定なら空文字 (no-op)
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
    working_dir: /mcp_server
    volumes:
      - ./mcp_server:/mcp_server
      - ./config:/mcp_server/config:ro   # Phase 23: db_pools.yaml マウント (D-02)
      - claude-code-outputs:/shared/claude-code-outputs   # Phase 23 Plan 02: overflow output
      - thread-files:/shared/thread-files   # Phase 37 D-04: RW
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DB_POOLS_CONFIG=/mcp_server/config/db_pools.yaml  # Phase 23 追加
      - CLAUDE_CODE_OUTPUT_DIR=/shared/claude-code-outputs   # Phase 23 Plan 02 追加
      - THREAD_FILES_DIR=/shared/thread-files   # Phase 37 D-04
      # HTTP プロキシ runtime env — 未設定なら空文字 (no-op)、Tavily / npm install / curl 等が honor
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
    # D-06: ホストポートは公開しない（内部ネットワーク専用）
    # worker からは mcp-server:8001 でアクセス
    depends_on:
      postgres:
        condition: service_healthy   # Phase 23: db_query が postgres に直接接続するため
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s   # Phase 37: MarkItDown + magika/onnxruntime init 吸収 (30s → 60s)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    # --reload-dir: dev server が watch する範囲を app/ のみに限定 (ホワイトリスト方式)
    # Phase 39 で worktree 並列実行時にリロード暴発 (60s で 136 events) → 401 連発 / JWT 失効が起きたため。
    # --reload-exclude (fnmatch) では絶対パスに対するマッチが弱く、深い階層を確実に除外できない。
    # --reload-dir で /app/app のみ watch すれば .claude/ .planning/ frontend/ tests/ などは
    # 物理的に watcher の対象外になる (Phase 39 quick-260513-e7g)
    command: >-
      uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir app
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - AGENT_DIR=/app/agents
      - MENU_DIR=/app/menus
      - APP_DIR=/app/apps
      - VITE_APP_BASE=${VITE_APP_BASE:-}
      - THREAD_FILES_DIR=/shared/thread-files   # Phase 37 D-04
      # HTTP プロキシ runtime env — uv sync / httpx / Copilot SDK 経由 (subprocess に伝搬) 用
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
      - ./config:/app/config:ro  # iframe-rpc DB pool config (Phase 18)
      - thread-files:/shared/thread-files   # Phase 37 D-04: RW (削除 + 将来のアップロード)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: uv run arq app.jobs.worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - AGENT_DIR=/app/agents
      - MENU_DIR=/app/menus
      - APP_DIR=/app/apps
      - MCP_SERVER_URL=http://mcp-server:8001
      - THREAD_FILES_DIR=/shared/thread-files   # Phase 37 D-04
      # HTTP プロキシ runtime env — Copilot SDK subprocess に env=os.environ で伝搬され、
      # bundled CLI バイナリ (undici EnvHttpProxyAgent) が GitHub Copilot エンドポイントに
      # 対して HTTP_PROXY/HTTPS_PROXY/NO_PROXY を honor する
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
    volumes:
      - .:/app
      - ~/.copilot_sdk:/root/.copilot_sdk
      - ./config:/app/config:ro  # iframe-rpc DB pool config (Phase 18)
      - claude-code-outputs:/shared/claude-code-outputs:ro   # Phase 23 Plan 02: read-only
      - thread-files:/shared/thread-files:ro   # Phase 37 D-04: RO (将来の scan 用途)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mcp-server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev        # dev ステージを明示（multi-stage Dockerfile 対応）
      args:
        # HTTP プロキシ build args — bun install 経由でレジストリにアクセスする際に使用
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # anonymous volume preserves container's node_modules
    environment:
      - API_TARGET=http://api:8000
      - VITE_APP_BASE=${VITE_APP_BASE:-}
      # HTTP プロキシ runtime env — dev mode で bun run dev の hot install 経由など
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,mcp-server,api,frontend,worker}
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  redis-data:
  postgres-data:
  claude-code-outputs:   # Phase 23 Plan 02: mcp-server (RW) / worker (RO) shared volume
  thread-files:          # Phase 37 D-04: api (RW) / mcp-server (RW) / worker (RO)
